<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#e8f4fd"/>
  
  <!-- Ground -->
  <path d="M0 250 Q200 240 400 250 L400 300 L0 300 Z" fill="#8fbc8f"/>
  
  <!-- Bicycle -->
  <g transform="translate(120, 180)">
    <!-- Rear wheel -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#666" stroke-width="1"/>
    <!-- Spokes rear -->
    <g stroke="#666" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-35"/>
      <line x1="0" y1="0" x2="0" y2="35"/>
      <line x1="0" y1="0" x2="-35" y2="0"/>
      <line x1="0" y1="0" x2="35" y2="0"/>
      <line x1="0" y1="0" x2="-25" y2="-25"/>
      <line x1="0" y1="0" x2="25" y2="-25"/>
      <line x1="0" y1="0" x2="-25" y2="25"/>
      <line x1="0" y1="0" x2="25" y2="25"/>
    </g>
    
    <!-- Front wheel -->
    <circle cx="100" cy="0" r="40" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="100" cy="0" r="35" fill="none" stroke="#666" stroke-width="1"/>
    <!-- Spokes front -->
    <g stroke="#666" stroke-width="1">
      <line x1="100" y1="0" x2="100" y2="-35"/>
      <line x1="100" y1="0" x2="100" y2="35"/>
      <line x1="100" y1="0" x2="65" y2="0"/>
      <line x1="100" y1="0" x2="135" y2="0"/>
      <line x1="100" y1="0" x2="75" y2="-25"/>
      <line x1="100" y1="0" x2="125" y2="-25"/>
      <line x1="100" y1="0" x2="75" y2="25"/>
      <line x1="100" y1="0" x2="125" y2="25"/>
    </g>
    
    <!-- Frame -->
    <path d="M0 0 L40 -50 L90 -50 L100 0" fill="none" stroke="#2c3e50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 -50 L40 -80" fill="none" stroke="#2c3e50" stroke-width="5" stroke-linecap="round"/>
    <path d="M90 -50 L100 -80" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Handlebars -->
    <path d="M100 -80 L120 -80" fill="none" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 -80 L120 -90" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
    <path d="M115 -90 L125 -90" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Seat -->
    <ellipse cx="40" cy="-80" rx="15" ry="5" fill="#2c3e50"/>
    
    <!-- Pedals -->
    <g transform="translate(0, 0)">
      <line x1="0" y1="0" x2="-25" y2="25" stroke="#333" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="25" y2="-25" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Chain -->
    <path d="M0 0 Q20 10 40 0 Q60 -10 80 0 Q90 10 100 0" fill="none" stroke="#444" stroke-width="2"/>
    <path d="M0 0 Q20 -10 40 0 Q60 10 80 0 Q90 -10 100 0" fill="none" stroke="#444" stroke-width="2"/>
  </g>
  
  <!-- Pelican -->
  <g transform="translate(160, 80)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="white" stroke="#ddd" stroke-width="2"/>
    
    <!-- Wing -->
    <path d="M-10 -10 Q-40 -30 -20 -50 Q-5 -40 0 -20 Q-5 -10 -10 -10" fill="white" stroke="#ccc" stroke-width="1.5"/>
    <path d="M-15 -5 Q-35 -20 -15 -35 Q0 -25 -5 -10" fill="none" stroke="#ddd" stroke-width="1"/>
    
    <!-- Neck -->
    <path d="M35 -15 Q50 -40 45 -65 Q40 -70 30 -60 Q35 -40 35 -15" fill="white" stroke="#ddd" stroke-width="2"/>
    
    <!-- Head -->
    <ellipse cx="35" cy="-70" rx="18" ry="15" fill="white" stroke="#ddd" stroke-width="2"/>
    
    <!-- Beak (large pelican beak) -->
    <path d="M53 -70 Q80 -65 85 -70 Q80 -75 53 -70" fill="#ff8c00" stroke="#e67300" stroke-width="2"/>
    <path d="M53 -78 Q75 -75 80 -78 Q75 -81 53 -78" fill="#ffaa00" stroke="#e67300" stroke-width="2"/>
    <!-- Pouch -->
    <path d="M53 -78 Q65 -95 53 -85" fill="#ffcc66" stroke="#e67300" stroke-width="1" opacity="0.7"/>
    
    <!-- Eye -->
    <circle cx="48" cy="-73" r="3" fill="#1a1a2e"/>
    <circle cx="49" cy="-74" r="1" fill="white"/>
    
    <!-- Crest/feathers on head -->
    <path d="M30 -82 Q35 -90 40 -82" fill="none" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
    <path d="M40 -85 Q45 -93 50 -85" fill="none" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Legs (gripping handlebars) -->
    <g transform="translate(35, -30)">
      <path d="M0 0 L15 30 L20 35" fill="none" stroke="#ff8c00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 0 L-10 30 L-15 35" fill="none" stroke="#ff8c00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Feet on handlebars -->
      <path d="M20 35 L30 35" stroke="#ff8c00" stroke-width="4" stroke-linecap="round"/>
      <path d="M-15 35 L-25 35" stroke="#ff8c00" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Tail feathers -->
    <path d="M-45 0 Q-60 -10 -45 -20" fill="white" stroke="#ddd" stroke-width="1.5"/>
    <path d="M-45 5 Q-60 0 -45 -10" fill="white" stroke="#ddd" stroke-width="1.5"/>
    <path d="M-45 -5 Q-60 -15 -45 -25" fill="white" stroke="#ddd" stroke-width="1.5"/>
  </g>
  
  <!-- Motion lines -->
  <g stroke="#64b5f6" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <line x1="30" y1="180" x2="10" y2="175"/>
    <line x1="35" y1="200" x2="15" y2="200"/>
    <line x1="30" y1="220" x2="10" y2="225"/>
    <line x1="80" y1="160" x2="60" y2="155"/>
  </g>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="30" fill="#ffd700" opacity="0.9"/>
  <g stroke="#ffd700" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="350" y1="15" x2="350" y2="5"/>
    <line x1="350" y1="85" x2="350" y2="95"/>
    <line x1="315" y1="50" x2="305" y2="50"/>
    <line x1="385" y1="50" x2="395" y2="50"/>
    <line x1="322" y1="22" x2="314" y2="14"/>
    <line x1="378" y1="78" x2="386" y2="86"/>
    <line x1="322" y1="78" x2="314" y2="86"/>
    <line x1="378" y1="22" x2="386" y2="14"/>
  </g>
  
  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <ellipse cx="80" cy="60" rx="25" ry="15"/>
    <ellipse cx="110" cy="55" rx="20" ry="12"/>
    <ellipse cx="130" cy="60" rx="18" ry="10"/>
    <ellipse cx="300" cy="80" rx="20" ry="12"/>
    <ellipse cx="325" cy="75" rx="18" ry="10"/>
    <ellipse cx="340" cy="80" rx="15" ry="8"/>
  </g>
</svg>