<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="skysix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd8ff"/>
      <stop offset="100%" stop-color="#c9f0ff"/>
    </linearGradient>
    <radialGradient id="sunrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6b0"/>
      <stop offset="100%" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="640" height="480" fill="url(#skysix)"/>

  <!-- Sun -->
  <circle cx="530" cy="90" r="70" fill="url(#sunrad)"/>
  <circle cx="530" cy="90" r="34" fill="#ffe66d"/>

  <!-- Puffy clouds -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="110" cy="80" rx="44" ry="22"/>
    <ellipse cx="150" cy="66" rx="34" ry="20"/>
    <ellipse cx="185" cy="82" rx="30" ry="16"/>
    <ellipse cx="420" cy="60" rx="38" ry="18"/>
    <ellipse cx="455" cy="50" rx="28" ry="15"/>
  </g>

  <!-- Distant city -->
  <g fill="#9bb8cc" opacity="0.8">
    <rect x="0" y="250" width="46" height="70"/>
    <rect x="54" y="230" width="38" height="90"/>
    <rect x="100" y="262" width="50" height="58"/>
    <rect x="160" y="240" width="34" height="80"/>
    <rect x="470" y="245" width="44" height="75"/>
    <rect x="522" y="228" width="36" height="92"/>
    <rect x="566" y="255" width="52" height="65"/>
  </g>

  <!-- Skatepark bowl -->
  <path d="M0 340 Q160 300 320 336 Q480 372 640 336 L640 480 L0 480 Z" fill="#b8b4c8"/>
  <path d="M0 340 Q160 300 320 336 Q480 372 640 336" fill="none" stroke="#8a8699" stroke-width="5"/>

  <!-- Ramp on right -->
  <path d="M480 480 L640 480 L640 350 Q560 360 480 480 Z" fill="#a5a1b8"/>
  <path d="M640 350 Q560 360 480 480" fill="none" stroke="#7d7994" stroke-width="5"/>

  <!-- Ramp on left -->
  <path d="M0 480 L160 480 L96 380 Q40 410 0 462 Z" fill="#a5a1b8"/>
  <path d="M96 380 Q40 410 0 462" fill="none" stroke="#7d7994" stroke-width="5"/>

  <!-- Landing slope markings -->
  <g stroke="#928ea8" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M240 400 h60"/>
    <path d="M360 420 h60"/>
    <path d="M270 440 h60"/>
  </g>

  <!-- BMX bike mid-air -->
  <g transform="translate(310, 250) rotate(-14)">
    <!-- Wheels -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#22242e" stroke-width="7"/>
    <circle cx="86" cy="0" r="34" fill="none" stroke="#22242e" stroke-width="7"/>
    <circle cx="0" cy="0" r="5" fill="#55586a"/>
    <circle cx="86" cy="0" r="5" fill="#55586a"/>
    <path d="M0 -30 V30 M-30 0 H30 M-21 -21 L21 21 M-21 21 L21 -21" stroke="#7a7d94" stroke-width="1.6"/>
    <path d="M86 -30 V30 M56 0 H116 M65 -21 L107 21 M65 21 L107 -21" stroke="#7a7d94" stroke-width="1.6"/>

    <!-- Frame -->
    <path d="M0 0 L34 -44 L74 -44 L86 0 Z" fill="none" stroke="#e63946" stroke-width="7" stroke-linejoin="round"/>
    <path d="M34 -44 L34 -60" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>

    <!-- Handlebars -->
    <path d="M74 -44 L84 -58" stroke="#22242e" stroke-width="7" stroke-linecap="round"/>
    <path d="M64 -70 Q84 -66 104 -72" fill="none" stroke="#22242e" stroke-width="7" stroke-linecap="round"/>

    <!-- Seat -->
    <path d="M22 -66 h26 l-8 7 h-16 Z" fill="#22242e"/>

    <!-- Crank -->
    <circle cx="34" cy="-6" r="8" fill="none" stroke="#55586a" stroke-width="4"/>
    <path d="M34 -6 L44 6" stroke="#55586a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Pelican doing the stunt -->
  <g transform="translate(330, 150) rotate(-8)">
    <!-- Tail feathers flared -->
    <path d="M-42 -6 Q-74 -22 -64 -40 Q-46 -26 -36 -14 Z" fill="#f7f5f0" stroke="#d5d1c8" stroke-width="2"/>
    <path d="M-44 6 Q-76 2 -66 -18 Q-48 -8 -38 2 Z" fill="#fcfaf6" stroke="#d5d1c8" stroke-width="2"/>
    <path d="M-42 -16 Q-70 -34 -58 -50 Q-44 -36 -34 -24 Z" fill="#ffffff" stroke="#d5d1c8" stroke-width="2"/>

    <!-- Body -->
    <ellipse cx="0" cy="0" rx="48" ry="33" fill="#fdfcf9" stroke="#d5d1c8" stroke-width="2"/>

    <!-- Wing flapping up -->
    <path d="M-10 -14 Q-34 -52 4 -58 Q34 -40 16 -10 Q4 -6 -10 -14 Z" fill="#ffffff" stroke="#d5d1c8" stroke-width="2"/>
    <path d="M-2 -26 Q-18 -46 4 -48 M4 -30 Q-8 -44 8 -46" fill="none" stroke="#e3dfd6" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M30 -18 Q52 -34 48 -66 Q46 -76 34 -66 Q40 -40 24 -22 Z" fill="#f8f6f1" stroke="#d5d1c8" stroke-width="2"/>

    <!-- Head -->
    <ellipse cx="42" cy="-74" rx="19" ry="16" fill="#ffffff" stroke="#d5d1c8" stroke-width="2"/>

    <!-- Crest swept back by wind -->
    <path d="M30 -88 Q20 -98 12 -94 M40 -94 Q34 -106 24 -106" fill="none" stroke="#d5d1c8" stroke-width="3" stroke-linecap="round"/>

    <!-- Beak open in excitement -->
    <path d="M58 -80 L104 -74 L58 -68 Z" fill="#ff9f1c" stroke="#e07f10" stroke-width="2" stroke-linejoin="round"/>
    <path d="M58 -66 Q86 -64 96 -70 Q90 -52 68 -50 Q57 -54 55 -60 Z" fill="#ffc971" stroke="#e07f10" stroke-width="2" stroke-linejoin="round"/>
    <path d="M58 -68 L100 -72 L96 -66 Z" fill="#ffb84d"/>

    <!-- Eye wide -->
    <circle cx="52" cy="-80" r="5" fill="#22242e"/>
    <circle cx="53.6" cy="-81.6" r="1.8" fill="#ffffff"/>

    <!-- Legs gripping pedals -->
    <path d="M14 24 Q28 40 40 52" fill="none" stroke="#f79f1c" stroke-width="6" stroke-linecap="round"/>
    <path d="M-4 24 Q14 44 30 62" fill="none" stroke="#f79f1c" stroke-width="6" stroke-linecap="round"/>
    <path d="M36 56 l13 5 M26 66 l13 5" stroke="#f79f1c" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Action burst behind the bike -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M215 300 l-26 6 l18 12 z"/>
    <path d="M200 330 l-30 2 l22 14 z"/>
    <path d="M235 356 l-24 14 l6 20 z"/>
    <path d="M262 274 l-30 -8 l-4 22 z"/>
  </g>

  <!-- Motion arcs -->
  <path d="M170 380 Q250 300 400 340" fill="none" stroke="#4fc3f7" stroke-width="5" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.7"/>

  <!-- Crowd confetti -->
  <g opacity="0.9">
    <rect x="120" y="180" width="8" height="8" fill="#e63946" transform="rotate(20 124 184)"/>
    <rect x="160" y="140" width="7" height="7" fill="#ffd166" transform="rotate(-30 163 143)"/>
    <rect x="460" y="160" width="8" height="8" fill="#06d6a0" transform="rotate(15 464 164)"/>
    <rect x="500" y="200" width="7" height="7" fill="#8338ec" transform="rotate(-20 503 203)"/>
    <rect x="400" y="120" width="7" height="7" fill="#ff006e" transform="rotate(40 403 123)"/>
    <circle cx="90" cy="220" r="4" fill="#ffd166"/>
    <circle cx="540" cy="240" r="4" fill="#e63946"/>
  </g>
</svg>
