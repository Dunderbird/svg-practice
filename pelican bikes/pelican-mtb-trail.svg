<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="trailSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b5e2fa"/>
      <stop offset="100%" stop-color="#c9e6c9"/>
    </linearGradient>
    <linearGradient id="mtnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5d6e6"/>
      <stop offset="100%" stop-color="#7a90aa"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="640" height="480" fill="url(#trailSky)"/>

  <!-- Mountains -->
  <g fill="url(#mtnGrad)">
    <path d="M-30 220 L80 140 L190 220 Z"/>
    <path d="M120 240 L220 140 L320 240 Z"/>
    <path d="M260 220 L360 120 L460 220 Z"/>
    <path d="M420 240 L520 140 L620 240 Z"/>
  </g>
  <g fill="#d6e2f0" opacity="0.8">
    <path d="M-30 220 L80 140 L45 220 Z"/>
    <path d="M120 240 L220 140 L180 240 Z"/>
    <path d="M260 220 L360 120 L320 220 Z"/>
    <path d="M420 240 L520 140 L480 240 Z"/>
  </g>

  <!-- Trees -->
  <g fill="#6fa56f">
    <circle cx="80" cy="260" r="28"/>
    <circle cx="100" cy="240" r="24"/>
    <circle cx="60" cy="240" r="24"/>
    <rect x="96" y="280" width="8" height="40"/>
    <circle cx="200" cy="250" r="26"/>
    <circle cx="220" cy="232" r="22"/>
    <circle cx="180" cy="232" r="22"/>
    <rect x="216" y="270" width="8" height="40"/>
    <circle cx="320" cy="260" r="30"/>
    <circle cx="340" cy="238" r="26"/>
    <circle cx="300" cy="238" r="26"/>
    <rect x="336" y="284" width="8" height="36"/>
    <circle cx="500" cy="255" r="28"/>
    <circle cx="520" cy="235" r="24"/>
    <circle cx="480" cy="235" r="24"/>
    <rect x="516" y="275" width="8" height="40"/>
    <circle cx="580" cy="245" r="24"/>
    <circle cx="600" cy="230" r="20"/>
    <circle cx="560" cy="230" r="20"/>
    <rect x="596" y="265" width="6" height="40"/>
  </g>

  <!-- Forest floor -->
  <path d="M0 310 Q160 340 320 320 Q480 300 640 320 L640 480 L0 480 Z" fill="#7fa87f"/>
  <path d="M0 310 Q160 340 320 320 Q480 300 640 320" fill="none" stroke="#6b936b" stroke-width="3"/>

  <!-- Dirt trail -->
  <path d="M0 370 Q200 400 320 360 Q440 320 640 350 L640 480 L0 480 Z" fill="#d8b89c"/>
  <path d="M0 370 Q200 400 320 360 Q440 320 640 350" fill="none" stroke="#c5a786" stroke-width="4"/>

  <!-- Rocks -->
  <g fill="#b8a5a0">
    <ellipse cx="120" cy="410" rx="14" ry="6"/>
    <ellipse cx="380" cy="390" rx="12" ry="5"/>
    <ellipse cx="520" cy="400" rx="10" ry="4"/>
  </g>

  <!-- MTB -->
  <g transform="translate(240, 348)">
    <!-- Wheels -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#2b2b2b" stroke-width="6"/>
    <circle cx="110" cy="0" r="42" fill="none" stroke="#2b2b2b" stroke-width="6"/>
    <g stroke="#8ea3b8" stroke-width="1.4" opacity="0.85">
      <path d="M0 -38 V38 M-38 0 H38 M-27 -27 L27 27 M-27 27 L27 -27"/>
      <path d="M110 -38 V38 M72 0 H148 M83 -27 L137 27 M83 27 L137 -27"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="#5a5a5a"/>
    <circle cx="110" cy="0" r="5" fill="#5a5a5a"/>

    <!-- Frame -->
    <path d="M0 0 L30 -52 L80 -52 L110 0 Z" fill="none" stroke="#4a90e2" stroke-width="7" stroke-linejoin="round"/>
    <path d="M30 -52 L20 -72" stroke="#4a90e2" stroke-width="7" stroke-linecap="round"/>
    <path d="M80 -52 L92 -66" stroke="#4a90e2" stroke-width="7" stroke-linecap="round"/>

    <!-- Forks -->
    <path d="M110 0 L102 -52" stroke="#4a90e2" stroke-width="7" stroke-linecap="round"/>

    <!-- Handlebar -->
    <path d="M92 -66 Q86 -88 62 -88" fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
    <path d="M52 -92 h20" stroke="#7fb069" stroke-width="8" stroke-linecap="round"/>

    <!-- Seat -->
    <path d="M10 -78 Q24 -86 38 -78 Q24 -72 10 -78 Z" fill="#2b2b2b"/>

    <!-- Crank -->
    <circle cx="30" cy="-8" r="9" fill="none" stroke="#5a5a5a" stroke-width="4"/>
    <path d="M30 -8 L42 6 M30 -8 L18 -22" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
    <path d="M36 10 h12 M12 -26 h12" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>

    <!-- Knobby tires detail -->
    <circle cx="0" cy="-40" r="3" fill="#4a4a4a"/>
    <circle cx="40" cy="0" r="3" fill="#4a4a4a"/>
    <circle cx="110" cy="-40" r="3" fill="#4a4a4a"/>
    <circle cx="70" cy="0" r="3" fill="#4a4a4a"/>
  </g>

  <!-- Pelican on MTB -->
  <g transform="translate(280, 240)">
    <!-- Tail -->
    <path d="M-40 -6 Q-62 -16 -56 -30 Q-44 -22 -34 -12 Z" fill="#f3f1eb" stroke="#d2ccc2" stroke-width="1.5"/>
    <path d="M-40 4 Q-60 0 -54 -14 Q-42 -8 -34 0 Z" fill="#f9f7f2" stroke="#d2ccc2" stroke-width="1.5"/>

    <!-- Body -->
    <ellipse cx="0" cy="0" rx="46" ry="31" fill="#fdfcf7" stroke="#d2ccc2" stroke-width="2"/>

    <!-- Wing -->
    <path d="M-6 -10 Q-22 -32 12 -38 Q30 -24 16 -6 Q6 -2 -6 -10 Z" fill="#ffffff" stroke="#d2ccc2" stroke-width="1.5"/>
    <path d="M0 -20 Q-12 -30 4 -34" fill="none" stroke="#e2ded4" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M28 -16 Q50 -30 44 -62 Q42 -72 30 -62 Q36 -36 22 -20 Z" fill="#f7f5ee" stroke="#d2ccc2" stroke-width="2"/>

    <!-- Head -->
    <ellipse cx="38" cy="-70" rx="18" ry="15" fill="#ffffff" stroke="#d2ccc2" stroke-width="2"/>

    <!-- Beak -->
    <path d="M54 -74 Q84 -70 96 -74 Q84 -66 54 -62 Z" fill="#f9b233" stroke="#d18a1c" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M54 -62 Q82 -60 92 -66 Q88 -48 64 -46 Q54 -48 52 -56 Z" fill="#ffcf7d" stroke="#d18a1c" stroke-width="1.8" stroke-linejoin="round"/>

    <circle cx="48" cy="-76" r="4" fill="#2f2c28"/>
    <circle cx="49.4" cy="-77.4" r="1.4" fill="#ffffff"/>

    <path d="M24 -82 Q28 -90 34 -84" fill="none" stroke="#d2ccc2" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Legs -->
    <path d="M16 24 Q34 42 48 58" fill="none" stroke="#f39c2b" stroke-width="5" stroke-linecap="round"/>
    <path d="M2 24 Q18 46 34 68" fill="none" stroke="#f39c2b" stroke-width="5" stroke-linecap="round"/>
    <path d="M44 62 l12 6 M30 72 l12 6" stroke="#f39c2b" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Ferns -->
  <g fill="#7fa87f">
    <path d="M60 330 q10 -20 0 -40 q-10 20 0 40"/>
    <path d="M70 340 q8 -18 0 -36 q-8 18 0 36"/>
    <path d="M410 320 q12 -24 0 -48 q-12 24 0 48"/>
    <path d="M420 330 q9 -20 0 -40 q-9 20 0 40"/>
    <path d="M560 325 q10 -20 0 -40 q-10 20 0 40"/>
  </g>

  <!-- Sun rays through trees -->
  <g stroke="#fff4c2" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <path d="M40 120 L80 200"/>
    <path d="M140 100 L180 200"/>
    <path d="M280 80 L300 220"/>
    <path d="M420 90 L400 220"/>
    <path d="M520 110 L480 220"/>
  </g>
</svg>
