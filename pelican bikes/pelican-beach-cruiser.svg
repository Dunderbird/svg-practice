<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="atmo3" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#ffe9c7"/>
      <stop offset="60%" stop-color="#ffc8a2"/>
      <stop offset="100%" stop-color="#e88e7d"/>
    </radialGradient>
  </defs>

  <!-- Sunset sky -->
  <rect width="600" height="450" fill="url(#atmo3)"/>

  <!-- Low sun -->
  <circle cx="490" cy="330" r="55" fill="#fff1b8" opacity="0.95"/>
  <circle cx="490" cy="330" r="70" fill="#fff1b8" opacity="0.25"/>

  <!-- Palm silhouettes -->
  <g fill="#5d3a5e" opacity="0.9">
    <path d="M70 340 Q65 250 78 210 L88 208 Q76 250 84 338 Z"/>
    <path d="M83 210 Q50 190 30 200 Q55 200 80 218 Z"/>
    <path d="M83 210 Q70 176 82 158 Q86 180 92 210 Z"/>
    <path d="M83 210 Q115 178 138 184 Q112 194 92 218 Z"/>
    <path d="M83 210 Q118 200 140 214 Q112 214 92 222 Z"/>
  </g>

  <!-- Ocean band -->
  <rect y="340" width="600" height="34" fill="#7c5a8a" opacity="0.85"/>
  <path d="M0 348 h600 M60 362 h90 M230 356 h110 M400 366 h120" stroke="#b98bb0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Boardwalk -->
  <rect y="374" width="600" height="76" fill="#c98f5f"/>
  <g stroke="#b5784a" stroke-width="2">
    <path d="M40 374 v76 M120 374 v76 M200 374 v76 M280 374 v76 M360 374 v76 M440 374 v76 M520 374 v76"/>
  </g>
  <path d="M0 412 h600" stroke="#b5784a" stroke-width="2.5"/>

  <!-- Bike -->
  <g transform="translate(200, 348)">
    <!-- Wheels -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#26221f" stroke-width="6"/>
    <circle cx="140" cy="0" r="42" fill="none" stroke="#26221f" stroke-width="6"/>
    <!-- Spoke rings -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#d9d2c8" stroke-width="1.5" stroke-dasharray="4 5"/>
    <circle cx="140" cy="0" r="30" fill="none" stroke="#d9d2c8" stroke-width="1.5" stroke-dasharray="4 5"/>
    <circle cx="0" cy="0" r="5" fill="#4a4440"/>
    <circle cx="140" cy="0" r="5" fill="#4a4440"/>

    <!-- Step-through frame (beach cruiser) -->
    <g fill="none" stroke="#2f9e8f" stroke-width="7" stroke-linecap="round">
      <path d="M0 0 Q40 -20 70 -62"/>
      <path d="M70 -62 L108 -62"/>
      <path d="M70 -62 Q110 -40 140 0"/>
      <path d="M108 -62 L132 -78"/>
    </g>

    <!-- Back fender / ornament -->
    <path d="M-44 -8 Q-20 -52 8 -46" fill="none" stroke="#2f9e8f" stroke-width="5" stroke-linecap="round"/>

    <!-- Handlebar (beach cruiser sweep) -->
    <path d="M132 -78 Q128 -96 106 -100 Q96 -100 96 -94" fill="none" stroke="#26221f" stroke-width="5" stroke-linecap="round"/>
    <path d="M106 -100 Q112 -104 118 -102" fill="none" stroke="#e0c9a6" stroke-width="6" stroke-linecap="round"/>

    <!-- Seat -->
    <path d="M52 -66 Q70 -74 86 -66 Q70 -58 52 -66 Z" fill="#8e44ad"/>
    <path d="M66 -64 L66 -70" stroke="#26221f" stroke-width="5" stroke-linecap="round"/>

    <!-- Crank/pedals -->
    <circle cx="70" cy="-6" r="12" fill="none" stroke="#4a4440" stroke-width="4"/>
    <path d="M70 -6 L82 10 M70 -6 L58 -22" stroke="#4a4440" stroke-width="4" stroke-linecap="round"/>
    <path d="M76 14 h14 M50 -26 h14" stroke="#26221f" stroke-width="5" stroke-linecap="round"/>

    <!-- Basket on front -->
    <g transform="translate(118,-70)">
      <path d="M0 0 L28 0 L24 26 L4 26 Z" fill="#a9713f" stroke="#7e5228" stroke-width="2"/>
      <path d="M2 8 h24 M3 16 h22 M8 0 L6 26 M20 0 L22 26" stroke="#7e5228" stroke-width="1.6" fill="none"/>
    </g>
  </g>

  <!-- Pelican (sunset cruising) -->
  <g transform="translate(268, 226)">
    <path d="M-36 -14 Q-58 -24 -54 -38 Q-40 -30 -30 -18 Z" fill="#f6f1ea" stroke="#c9bfb4" stroke-width="1.5"/>
    <path d="M-36 2 Q-56 -2 -50 -16 Q-38 -10 -30 -2 Z" fill="#fbf8f4" stroke="#c9bfb4" stroke-width="1.5"/>

    <ellipse cx="0" cy="0" rx="44" ry="30" fill="#fdf8f2" stroke="#c9bfb4" stroke-width="2"/>

    <path d="M-4 -8 Q-16 -28 10 -34 Q26 -22 12 -6 Q4 -4 -4 -8 Z" fill="#ffffff" stroke="#c9bfb4" stroke-width="1.5"/>

    <path d="M26 -16 Q44 -28 38 -58 Q36 -68 24 -58 Q32 -32 18 -18 Z" fill="#faf6ef" stroke="#c9bfb4" stroke-width="2"/>

    <ellipse cx="34" cy="-64" rx="18" ry="15" fill="#ffffff" stroke="#c9bfb4" stroke-width="2"/>

    <!-- Beak -->
    <path d="M50 -68 Q84 -64 96 -68 Q84 -60 50 -61 Z" fill="#f9b233" stroke="#d18a1c" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M50 -61 Q82 -60 92 -66 Q88 -48 64 -45 Q50 -48 47 -55 Z" fill="#ffcf7d" stroke="#d18a1c" stroke-width="1.8" stroke-linejoin="round"/>

    <circle cx="46" cy="-70" r="4" fill="#33302e"/>
    <circle cx="47.3" cy="-71.2" r="1.4" fill="#ffffff"/>

    <path d="M24 -76 Q28 -84 34 -78" fill="none" stroke="#d8cfc6" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Legs on pedals -->
    <g fill="none" stroke="#f39c2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 24 Q34 38 46 58"/>
      <path d="M6 24 Q22 44 36 78"/>
    </g>
    <path d="M42 62 l12 6 M32 82 l12 6" stroke="#f39c2b" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Seagull accents -->
  <g fill="none" stroke="#7a5878" stroke-width="2.2" stroke-linecap="round">
    <path d="M120 96 q6 -8 12 0 q6 -8 12 0"/>
    <path d="M156 76 q5 -7 10 0 q5 -7 10 0"/>
  </g>

  <!-- Sparkles / glints -->
  <g fill="#fff7df" opacity="0.9">
    <circle cx="480" cy="280" r="3"/>
    <circle cx="530" cy="312" r="2.4"/>
    <circle cx="440" cy="298" r="2.6"/>
  </g>
</svg>
